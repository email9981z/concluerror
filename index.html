<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de Segurança</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #induction-container {
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.3s;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            color: #666;
        }

        .btn-fake {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #interaction-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: rgba(255, 255, 255, 0);
            cursor: pointer;
        }

        .test-notice {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(460px, calc(100% - 40px));
            box-sizing: border-box;
            padding: 28px 30px;
            background: linear-gradient(145deg, #ffffff, #f5f8fc);
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            color: #1f2937;
            font-size: 17px;
            font-weight: 600;
            line-height: 1.5;
            text-align: center;
            box-shadow: 0 14px 35px rgba(15, 23, 42, 0.12), 0 3px 8px rgba(15, 23, 42, 0.06);
        }

        .test-notice::before {
            content: "✓";
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background: #e8f1ff;
            color: #2878d4;
            font-size: 23px;
            font-weight: 700;
        }

        .notice-title {
            display: block;
        }

        .notice-subtitle {
            display: block;
            margin-top: 8px;
            color: #64748b;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.5;
        }

        .feedback-form {
            margin-top: 20px;
            text-align: left;
        }

        .feedback-label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        .feedback-input {
            display: block;
            width: 100%;
            min-height: 92px;
            box-sizing: border-box;
            padding: 11px 12px;
            resize: vertical;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #fff;
            color: #1f2937;
            font: inherit;
            font-size: 14px;
            outline: none;
        }

        .feedback-input:focus {
            border-color: #2878d4;
            box-shadow: 0 0 0 3px rgba(40, 120, 212, 0.14);
        }

        .feedback-submit {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 11px 18px;
            border: 0;
            border-radius: 8px;
            background: #2878d4;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
        }

        .feedback-submit:hover {
            background: #1f67b8;
        }

        .feedback-submit:disabled {
            cursor: default;
            opacity: 0.7;
        }

        .feedback-error {
            display: block;
            min-height: 18px;
            margin-top: 6px;
            color: #b42318;
            font-size: 12px;
            font-weight: 400;
        }

        .thank-you {
            display: block;
            margin-top: 18px;
            padding: 13px 15px;
            border-radius: 9px;
            background: #ecfdf3;
            color: #067647;
            font-size: 14px;
            font-weight: 600;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="interaction-layer"></div>

    <div id="induction-container">
        <div class="spinner"></div>
        <h1>Verificando sua conexão...</h1>
        <p>Clique no botão abaixo para continuar</p>
        <div class="btn-fake">CONTINUAR</div>
    </div>

    <section id="test-notice" class="test-notice hidden" aria-live="polite">
        <span class="notice-title">Desculpe, o pedido foi cancelado por questões internas.</span>
        <span class="notice-subtitle">O valor pago será reembolsado em até 3 dias para a mesma conta que realizou o pagamento.</span>

        <form id="feedback-form" class="feedback-form">
            <label class="feedback-label" for="feedback">Gostaria de deixar uma observação?</label>
            <textarea id="feedback" class="feedback-input" name="feedback" placeholder="Digite sua observação" maxlength="500"></textarea>
            <span id="feedback-error" class="feedback-error" role="alert"></span>
            <button class="feedback-submit" type="submit">Enviar</button>
        </form>

        <div id="thank-you" class="thank-you hidden" role="status">Obrigado! Sua observação foi recebida.</div>
    </section>

    <script>
        const layer = document.getElementById('interaction-layer');
        const container = document.getElementById('induction-container');
        const testNotice = document.getElementById('test-notice');
        const feedbackForm = document.getElementById('feedback-form');
        const feedbackInput = document.getElementById('feedback');
        const feedbackError = document.getElementById('feedback-error');
        const thankYou = document.getElementById('thank-you');

        function showCancelledOrder() {
            container.classList.add('hidden');
            testNotice.classList.remove('hidden');
            layer.style.pointerEvents = 'none';
            feedbackInput.focus();
        }

        layer.addEventListener('click', showCancelledOrder, { once: true });

        feedbackForm.addEventListener('submit', function (event) {
            event.preventDefault();
            feedbackError.textContent = '';

            if (!feedbackInput.value.trim()) {
                feedbackError.textContent = 'Digite uma observação antes de enviar.';
                feedbackInput.focus();
                return;
            }

            feedbackInput.disabled = true;
            feedbackForm.querySelector('button').disabled = true;
            feedbackForm.classList.add('hidden');
            thankYou.classList.remove('hidden');
        });
    </script>
</body>
</html>
