<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Bloqueio Robusto</title>
    <style>
        body {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <script>
        /**
         * TÉCNICA AVANÇADA: Hash-Loop e Injeção Massiva de Histórico
         * Esta técnica utiliza o hash da URL para criar estados de histórico que o navegador
         * interpreta como "novas páginas", dificultando o retorno à origem real.
         */

        function robustBackLock() {
            // 1. Inunda o histórico com múltiplos estados diferentes (usando hashes)
            // Isso cria uma "barreira" de entradas no histórico.
            for (let i = 0; i < 50; i++) {
                window.history.pushState({ page: i }, `Etapa ${i}`, window.location.pathname + `#locked-${i}`);
            }

            // 2. Escuta o evento de mudança no histórico
            window.addEventListener('popstate', function(event) {
                // Sempre que o usuário tenta voltar, empurra ele de volta para o topo do "muro" de hashes
                window.history.pushState(null, "", window.location.pathname + `#lock-active-${Date.now()}`);
                // Força um redirecionamento interno para garantir que o estado seja processado
                window.location.replace(window.location.pathname + "#main");
            });

            // 3. Bloqueio de cliques e interações que possam disparar navegação
            document.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
            }, true);

            // 4. Técnica de "Redirecionamento Circular"
            // Se o navegador conseguir sair do estado atual por algum motivo, 
            // este intervalo tenta "pescar" o usuário de volta.
            setInterval(() => {
                if (!window.location.hash.includes('locked')) {
                    window.history.pushState(null, "", window.location.pathname + "#re-locked");
                }
            }, 100);
        }

        /**
         * TÉCNICA DE REDIRECIONAMENTO DE SEGURANÇA
         * Se o usuário tentar usar o histórico longo (clique direito no botão voltar),
         * esta técnica tenta invalidar a tentativa.
         */
        function forceFocus() {
            window.onblur = function() {
                // Tenta recuperar o foco se o usuário interagir com a barra de ferramentas (limitado por segurança)
                setTimeout(() => window.focus(), 10);
            };
        }

        // Execução imediata e contínua
        (function init() {
            robustBackLock();
            forceFocus();
            
            // Impede que o usuário veja o menu de contexto (clique direito)
            document.oncontextmenu = () => false;
        })();
    </script>
</body>
</html>
